[build]
  command = '''
    curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 8.0 --install-dir "${HOME}/.dotnet" && \
    export DOTNET_ROOT="${HOME}/.dotnet" && \
    export PATH="${DOTNET_ROOT}:${PATH}" && \
    dotnet --version && \
    dotnet publish AgronomyStudio.csproj -c Release -o release && \
    test -f release/wwwroot/_framework/blazor.boot.json
  '''
  publish = "release/wwwroot"

[[redirects]]
  from = "/field-api/*"
  to = "/.netlify/functions/field-api/:splat"
  status = 200

[[redirects]]
  from = "/weather-api/*"
  to = "/.netlify/functions/weather-api/:splat"
  status = 200

[[redirects]]
  from = "/query-api/*"
  to = "/.netlify/functions/query-api/:splat"
  status = 200

[[redirects]]
  from = "/fred-api/*"
  to = "/.netlify/functions/fred-api/:splat"
  status = 200

[[redirects]]
  from = "/datagov-api/*"
  to = "/.netlify/functions/datagov-api/:splat"
  status = 200

[[redirects]]
  from = "/agronomy-api/*"
  to = "/.netlify/functions/agronomy-api/:splat"
  status = 200

[[redirects]]
  from = "/ai-search-api/*"
  to = "/.netlify/functions/ai-search-api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
