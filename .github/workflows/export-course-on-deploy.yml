name: Export Course on Deploy

# On deploy (push to master), ask the LLM Academy to draft a course from this
# repo's seed material (docs/lessons/next-course.md, or the deploy diff).
# See: https://github.com/bijanp24/LLM-Workflow/tree/master/automation
on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**' # CI/infra-only commits shouldn't spawn a course
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # need HEAD~1 for the diff fallback

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Export course to LLM Academy
        env:
          ACADEMY_DISPATCH_TOKEN: ${{ secrets.ACADEMY_DISPATCH_TOKEN }}
          CONTENT_REPO: bijanp24/LLM-Workflow
        run: node .github/scripts/export-course.mjs
