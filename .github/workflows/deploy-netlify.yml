name: Deploy Netlify

on:
  push:
    branches:
      - dev
      - test
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - production

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref_name }}-${{ inputs.environment || 'branch' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'master' && 'production') || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Select deploy settings
        id: deploy
        shell: bash
        run: |
          target="${{ inputs.environment }}"
          if [ -z "$target" ]; then
            case "${{ github.ref_name }}" in
              dev) target="dev" ;;
              test) target="test" ;;
              master) target="production" ;;
              *) echo "Unsupported deploy branch: ${{ github.ref_name }}" >&2; exit 1 ;;
            esac
          fi

          case "$target" in
            dev)
              echo "netlify_args=--alias=dev" >> "$GITHUB_OUTPUT"
              ;;
            test)
              echo "netlify_args=--alias=test" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "netlify_args=--prod" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deploy environment: $target" >&2
              exit 1
              ;;
          esac

      - name: Publish
        run: dotnet publish AgronomyStudio.csproj -c Release -o release

      - name: Verify Blazor build output
        run: test -f release/wwwroot/_framework/blazor.boot.json

      - name: Inject Google Maps API key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is not set; production GIS map will not load." >&2
            exit 1
          fi
          sed -i 's/"ApiKey": ""/"ApiKey": "'"$GOOGLE_MAPS_API_KEY"'"/' release/wwwroot/appsettings.json
          grep -q '"ApiKey": "' release/wwwroot/appsettings.json
          grep -qv '"ApiKey": ""' release/wwwroot/appsettings.json

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: >
          npx netlify-cli@latest deploy
          --dir=release/wwwroot
          --site="$NETLIFY_SITE_ID"
          --auth="$NETLIFY_AUTH_TOKEN"
          ${{ steps.deploy.outputs.netlify_args }}
