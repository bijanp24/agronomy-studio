name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - master
  push:
    branches:
      - dev
      - test
      - master

permissions:
  contents: read

jobs:
  functions:
    name: Functions (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  webapp:
    name: WebApp (Angular 22)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Type-check
        working-directory: webapp
        run: npm run typecheck

      - name: Test
        working-directory: webapp
        run: npm test

      - name: Build
        working-directory: webapp
        run: npm run build

      - name: Install Playwright
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: webapp
        run: npm run e2e

  verify:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgronomyStudio.csproj

      - name: Publish
        run: dotnet publish AgronomyStudio.csproj -c Release -o release --no-restore

      - name: Verify Blazor build output
        run: test -f release/wwwroot/_framework/blazor.boot.json
